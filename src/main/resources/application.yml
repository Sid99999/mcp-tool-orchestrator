spring:
  application:
    name: mcp-tool-orchestrator
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mcp_orchestrator}
    username: ${DB_USERNAME:mcp}
    password: ${DB_PASSWORD:mcp}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  sql:
    init:
      mode: always
  ai:
    mcp:
      server:
        enabled: true
        protocol: STATELESS
        name: mcp-tool-orchestrator
        version: 0.1.0
        type: SYNC
        instructions: "Tenant-aware MCP gateway exposing order and support tools with rate limiting, audit logging and resilience controls."
        request-timeout: 20s
        stateless:
          mcp-endpoint: /mcp
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
server:
  port: 8080
